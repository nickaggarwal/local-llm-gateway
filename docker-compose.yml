services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    # --- NVIDIA GPU (Linux) ---
    # Uncomment to use a GPU (requires nvidia-container-toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  gateway:
    build: .
    container_name: gateway
    ports:
      - "8501:8501"   # Streamlit UI
      - "8000:8000"   # (optional) FastAPI, if you switch the command
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-models:
